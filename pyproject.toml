[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sports_near_me"
version = "0.1.0"
description = "When do your followed teams play next, and can you watch or listen to them?"
requires-python = ">=3.9"
dependencies = ["pyyaml"]

[project.scripts]
sports-game = "sports_near_me.cli:main"

[tool.setuptools]
packages = ["sports_near_me", "sports_near_me.leagues"]
